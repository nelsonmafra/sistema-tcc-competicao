/* ================= banco de dados =================
   Todo o app conversa com o banco por esta interface única — a mesma desde a
   primeira versão, quando os dados viviam na capability `db` do artifact:

     db.collection('jogos').add({...})             -> {id}
     db.collection('jogos').doc(id).set({...})     -> grava o documento inteiro
     db.collection('jogos').doc(id).update({...})  -> altera só os campos passados
     db.collection('jogos').doc(id).delete()
     db.collection('jogos').onSnapshot(cb, erroCb) -> cb a cada mudança
     db.doc('jogos/ID')                            -> atalho para collection().doc()

   Três implementações, escolhidas no boot nesta ordem:
     1) supabaseDB — banco compartilhado do clube (Postgres no Supabase), ligado
        quando o config.js está preenchido. Entrada por e-mail e senha; quem
        pode o quê é decidido pelo próprio banco (ver supabase/schema.sql):
        treinador tem acesso total, atleta só lança os próprios jogos e lê
        elenco e jogos (os relatórios de partida).
     2) claude db — capability de artifact, quando aberto pelo claude.ai.
     3) localDB   — localStorage: modo de teste, dados só neste navegador. */
const COLS=['atletas','avaliacoes','metas','torneios','jogos','relatorios'];

/* ---------- 1) Supabase ---------- */
/* última 2.x primeiro — é a que suporta as chaves novas (sb_publishable_...);
   as seguintes são reservas, caso um dos CDNs esteja fora do ar */
const SB_LIBS=['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js',
               'https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js',
               'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js'];
/* aceita a URL do projeto com ou sem a parte final (/rest/v1, /auth/v1...),
   que é o que aparece copiado de algumas telas do painel do Supabase */
function sbCfg(){
  const c=window.TCC_CONFIG||{};
  const url=String(c.SUPABASE_URL||'').trim().replace(/\/+$/,'').replace(/\/(rest|auth|storage|realtime)\/v1$/,'');
  return {url, key:String(c.SUPABASE_ANON_KEY||'').trim()};
}
function sbConfigurado(){ const c=sbCfg(); return /^https:\/\/\S+$/.test(c.url) && c.key.length>30; }
function carregarScript(src){ return new Promise((ok,falhou)=>{ const el=document.createElement('script'); el.src=src; el.onload=()=>ok(); el.onerror=()=>falhou(new Error('não carregou '+src)); document.head.appendChild(el); }); }
/* a biblioteca vem do CDN, a não ser que a página já a tenha carregado */
async function garantirLibSupabase(){
  if(window.supabase&&window.supabase.createClient) return;
  let ultimo=null;
  for(const src of SB_LIBS){
    try{ await carregarScript(src); }catch(e){ ultimo=e; continue; }
    if(window.supabase&&window.supabase.createClient) return;
  }
  throw ultimo||new Error('biblioteca do Supabase não carregou');
}
/* traduz o erro do Postgres para os códigos que errMsg() já entende */
function sbErr(e){
  const err=new Error((e&&e.message)||'erro no banco');
  const c=String((e&&e.code)||''), st=(e&&e.status)||0;
  err.detalhe=[c,(e&&e.message)||''].filter(Boolean).join(' ').slice(0,140);
  if(c==='42501'||c==='PGRST301'||st===401||st===403) err.code='forbidden';
  else if(c==='PGRST116'||c.indexOf('23')===0||c.indexOf('22')===0) err.code='invalid_argument';
  else err.code='unavailable';
  return err;
}
function supabaseDB(sb){
  const subs={}, timers={};
  const snap=rows=>({docs:rows.map(r=>({id:r.id,exists:true,data:()=>r.data||{},metadata:{}})),size:rows.length,empty:!rows.length,docChanges:()=>[],metadata:{}});
  async function puxar(c){
    const {data,error}=await sb.from(c).select('id,data');
    if(error) throw sbErr(error);
    for(const s of (subs[c]||[])){ try{ s.cb(snap(data||[])); }catch(err){ console.error(err); } }
  }
  /* recarrega a coleção: depois de cada gravação e a cada evento em tempo real */
  function recarregar(c){
    clearTimeout(timers[c]);
    timers[c]=setTimeout(()=>{ puxar(c).catch(e=>{ console.error(c,e); for(const s of (subs[c]||[])) if(s.err) s.err(e); }); },150);
  }
  const docRef=(c,id)=>({
    set:async d=>{ const {error}=await sb.from(c).upsert({id,data:d}); if(error) throw sbErr(error); recarregar(c); },
    update:async d=>{ const {error}=await sb.rpc('doc_merge',{tabela:c,doc_id:id,patch:d}); if(error) throw sbErr(error); recarregar(c); },
    delete:async ()=>{ const {error}=await sb.from(c).delete().eq('id',id); if(error) throw sbErr(error); recarregar(c); },
  });
  /* tempo real: o técnico acompanha da arquibancada o jogo que outro está marcando */
  const canal=sb.channel('tcc-competicao');
  for(const c of COLS) canal.on('postgres_changes',{event:'*',schema:'public',table:c},()=>recarregar(c));
  canal.subscribe();
  return {
    doc:path=>{ const seg=String(path).split('/'); return docRef(seg.slice(0,-1).join('/'),seg[seg.length-1]); },
    collection:c=>({
      add:async d=>{ const {data,error}=await sb.from(c).insert({data:d}).select('id').single(); if(error) throw sbErr(error); recarregar(c); return {id:data.id}; },
      doc:id=>docRef(c,id),
      onSnapshot:(cb,err)=>{ (subs[c]=subs[c]||[]).push({cb,err}); recarregar(c); return ()=>{ subs[c]=(subs[c]||[]).filter(x=>x.cb!==cb); }; },
    }),
  };
}

/* ---------- 3) localStorage (modo de teste) ---------- */
function localDB(){
  let mem={}; let persist=true;
  try{ mem=JSON.parse(localStorage.getItem('tccdb')||'{}'); }catch(e){ persist=false; }
  const ls={};
  const saveLS=()=>{ if(!persist) return; try{ localStorage.setItem('tccdb',JSON.stringify(mem)); }catch(e){} };
  const notify=c=>{ (ls[c]||[]).forEach(f=>f({docs:Object.entries(mem[c]||{}).map(([id,d])=>({id,exists:true,data:()=>d,metadata:{}})),size:0,empty:false,docChanges:()=>[],metadata:{}})); };
  const docRef=(c,id)=>({
    set:async d=>{ (mem[c]=mem[c]||{})[id]=d; saveLS(); notify(c); },
    update:async d=>{ if(!mem[c]||!mem[c][id]){const e=new Error('inexistente');e.code='invalid_argument';throw e;} Object.assign(mem[c][id],d); saveLS(); notify(c); },
    delete:async ()=>{ if(mem[c])delete mem[c][id]; saveLS(); notify(c); },
  });
  return {
    doc:path=>{ const seg=path.split('/'); return docRef(seg.slice(0,-1).join('/'),seg[seg.length-1]); },
    collection:c=>({
      add:async d=>{ const id='l'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); (mem[c]=mem[c]||{})[id]=d; saveLS(); notify(c); return {id}; },
      doc:id=>docRef(c,id),
      onSnapshot:(f)=>{ (ls[c]=ls[c]||[]).push(f); setTimeout(()=>notify(c),10); return ()=>{}; },
    }),
  };
}

/* ================= diagnóstico do banco =================
   Uma tela que testa, em ordem, tudo que precisa funcionar e diz em português
   o que falhou. É o que aparece ao tocar na bolinha ao lado do título. */
window.abrirDiagnostico=async function(){
  const L=[]; const add=(s,t,d)=>L.push({s,t,d});
  const dlg=$('#dlg');
  const desenha=()=>{
    $('#dlgInner').innerHTML='<div class="dlg-h"><h3>Diagnóstico do banco</h3><button id="dlgX" aria-label="Fechar">✕</button></div>'
      +'<div class="dlg-b">'+L.map(x=>'<div class="diag-l diag-'+x.s+'"><b>'+(x.s==='ok'?'✓':x.s==='warn'?'!':'✕')+'</b>'
        +'<div><div class="diag-t">'+esc(x.t)+'</div>'+(x.d?'<div class="mini">'+esc(x.d)+'</div>':'')+'</div></div>').join('')
      +'<div class="mini" style="margin-top:10px">Se algo estiver com ✕, toque em <b>copiar</b> e me mande o texto.</div></div>'
      +'<div class="dlg-f"><button class="btn ghost" id="diagCopy">copiar</button><button class="btn" id="dlgCancel">Fechar</button></div>';
    $('#dlgX').onclick=$('#dlgCancel').onclick=()=>dlg.close();
    $('#diagCopy').onclick=async()=>{
      const txt=L.map(x=>(x.s==='ok'?'OK   ':x.s==='warn'?'AVISO':'ERRO ')+' '+x.t+(x.d?' — '+x.d:'')).join('\n');
      try{ await navigator.clipboard.writeText(txt); toast('Copiado ✓'); }
      catch(e){ toast('Não consegui copiar — tire um print da tela.',true); }
    };
  };
  const detalhe=e=>[e&&e.code,e&&e.message].filter(Boolean).join(' — ').slice(0,180)||'sem detalhe';
  if(!dlg.open) dlg.showModal();
  add('warn','Testando…',''); desenha();
  L.length=0;

  /* 1) configuração */
  const c=sbCfg();
  if(!sbConfigurado()){
    add('bad','Configuração (config.js)', (c.url?'':'URL vazia. ')+((c.key||'').length>30?'':'Chave vazia ou curta. ')+'O app está em modo local de teste: os dados ficam só neste aparelho.');
    desenha(); return;
  }
  add('ok','Configuração (config.js)', c.url);
  desenha();

  /* 2) biblioteca e cliente */
  if(!S.sb){ add('bad','Conexão com o Supabase','a biblioteca não carregou (internet bloqueada? CDN fora do ar?) — recarregue a página'); desenha(); return; }
  add('ok','Biblioteca do Supabase','carregada');
  desenha();

  /* 3) sessão */
  let user=null, erroSessao=null;
  try{ const r=await S.sb.auth.getUser(); erroSessao=r.error; user=r.data&&r.data.user; }catch(e){ erroSessao=e; }
  if(!user){ add('bad','Sessão', erroSessao?detalhe(erroSessao):'ninguém logado — entre com e-mail e senha'); desenha(); return; }
  add('ok','Sessão iniciada', user.email);
  desenha();

  /* 4) perfil e papel */
  const rp=await S.sb.from('perfis').select('papel,nome').eq('id',user.id).maybeSingle();
  if(rp.error) add('bad','Ler o seu perfil (tabela perfis)', detalhe(rp.error)+'  ·  provável falta de permissão: rode de novo o supabase/schema.sql');
  else if(!rp.data) add('bad','Ler o seu perfil (tabela perfis)','seu usuário não tem linha em perfis — refaça o passo 3 do docs/SUPABASE.md');
  else if(rp.data.papel==='treinador') add('ok','Seu papel no banco: treinador','acesso total');
  else add('warn','Seu papel no banco: '+rp.data.papel,'atleta só vê a aba Jogos e não grava avaliações, metas nem torneios. Para virar treinador, passo 3b do guia.');
  desenha();

  /* 5) leitura de cada coleção */
  for(const t of COLS){
    const r=await S.sb.from(t).select('id').limit(1);
    if(r.error) add('bad','Ler '+t, detalhe(r.error));
    else add('ok','Ler '+t, 'respondeu');
    desenha();
  }

  /* 6) gravação de teste (usa um registro invisível, e apaga em seguida) */
  const w=await S.sb.from('relatorios').upsert({id:'__diagnostico__',data:{teste:true,ts:Date.now()}});
  if(w.error) add('bad','Gravar (teste)', detalhe(w.error));
  else{
    add('ok','Gravar (teste)','gravou');
    const d=await S.sb.from('relatorios').delete().eq('id','__diagnostico__');
    add(d.error?'warn':'ok','Apagar o registro de teste', d.error?detalhe(d.error):'limpo');
  }
  desenha();

  /* 7) tempo real */
  await new Promise(res=>{
    let fim=false;
    const encerra=(s,t,d)=>{ if(fim)return; fim=true; add(s,t,d); try{S.sb.removeChannel(ch);}catch(e){} desenha(); res(); };
    const ch=S.sb.channel('diag-'+Date.now());
    ch.on('postgres_changes',{event:'*',schema:'public',table:'jogos'},()=>{});
    ch.subscribe(st=>{
      if(st==='SUBSCRIBED') encerra('ok','Tempo real','ligado — o técnico acompanha a partida de outro aparelho');
      else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED') encerra('warn','Tempo real',String(st)+' — o app funciona, mas as telas não se atualizam sozinhas entre aparelhos');
    });
    setTimeout(()=>encerra('warn','Tempo real','sem resposta em 8 segundos'),8000);
  });
};

/* ================= papéis ================= */
function applyRole(){
  const ath = S.role==='athlete';
  document.querySelectorAll('#nav button').forEach(b=>{ b.hidden = ath && b.dataset.t!=='jogos'; });
  if(ath && S.tab!=='jogos'){
    S.tab='jogos';
    document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('act',x.dataset.t==='jogos'));
    document.querySelectorAll('main section').forEach(x=>x.hidden = x.id!=='v-jogos');
  }
}

/* ================= boot ================= */
function bannerLocal(txt){ const off=$('#offline'); off.textContent=txt; off.hidden=false; }
function ligarColecoes(){
  applyRole();
  for(const name of COLS){
    S.db.collection(name).onSnapshot(snap=>{
      S[name]=snap.docs.filter(d=>d.exists).map(d=>({id:d.id,...d.data()}));
      try{ render(); }catch(e){ console.error(e); }
    },err=>{
      console.error(name,err);
      if(!S.avisado){ S.avisado=true; toast('Não consegui ler "'+name+'" do banco. Toque na bolinha ao lado do título.',true); }
    });
  }
  try{ render(); }catch(e){ console.error(e); }
}
function mostrarLogin(){
  $('#login').hidden=false; document.body.classList.add('trancado');
  setTimeout(()=>{ try{ $('#lgMail').focus(); }catch(e){} },50);
}
async function entrarNoClube(){
  S.db=supabaseDB(S.sb);
  const ru=await S.sb.auth.getUser();
  const user=ru&&ru.data&&ru.data.user;
  if(!user){ const e=new Error('sem sessão'); e.code='unauthenticated'; throw e; }
  S.uid=user.id;
  let papel='atleta', nome='';
  /* o Supabase devolve o erro DENTRO da resposta: se não olharmos, um treinador
     entra rebaixado a atleta sem ninguém avisar. Por isso o aviso explícito. */
  const rp=await S.sb.from('perfis').select('papel,nome').eq('id',user.id).maybeSingle();
  if(rp.error||!rp.data){
    console.error('perfis',rp.error);
    bannerLocal('Entrei no banco, mas não consegui ler o seu perfil'+(rp.error?' ('+[rp.error.code,rp.error.message].filter(Boolean).join(' ')+')':' — seu usuário não tem linha na tabela perfis')+'. Por segurança você está com acesso de ATLETA. Toque na bolinha ao lado do título para o diagnóstico.');
  } else { papel=rp.data.papel||'atleta'; nome=rp.data.nome||''; }
  S.role = papel==='treinador' ? 'coach' : 'athlete';
  $('#login').hidden=true; document.body.classList.remove('trancado');
  $('#st').classList.add('on');
  $('#st').title='Banco do clube · '+(nome||user.email)+' · '+papel;
  const sair=$('#sair'); sair.hidden=false;
  sair.onclick=async()=>{ try{ await S.sb.auth.signOut(); }catch(e){} location.reload(); };
  ligarColecoes();
}
(async()=>{
  try{ render(); }catch(e){ console.error(e); }

  if(sbConfigurado()){
    try{
      await garantirLibSupabase();
      const c=sbCfg();
      S.sb=window.supabase.createClient(c.url,c.key);
      $('#loginForm').onsubmit=async ev=>{
        ev.preventDefault();
        const b=$('#lgBtn'), err=$('#lgErr');
        err.textContent=''; b.disabled=true; b.textContent='Entrando…';
        let error=null;
        try{ ({error}=await S.sb.auth.signInWithPassword({email:$('#lgMail').value.trim(),password:$('#lgPass').value})); }
        catch(e){ error=e; }
        b.disabled=false; b.textContent='Entrar';
        if(error){
          const m=String(error.message||'');
          err.textContent = /invalid login|invalid credentials/i.test(m) ? 'E-mail ou senha incorretos.'
            : /not confirmed/i.test(m) ? 'E-mail ainda não confirmado — abra o link que o Supabase enviou.'
            : /failed to fetch|network/i.test(m) ? 'Sem internet ou banco fora do ar. Tente de novo.'
            : 'Não consegui entrar: '+m;
          return;
        }
        try{ await entrarNoClube(); }catch(e){ err.textContent=errMsg(e); }
      };
      const {data:{session}}=await S.sb.auth.getSession();
      if(session) await entrarNoClube(); else mostrarLogin();
      return;
    }catch(e){
      console.error(e);
      bannerLocal('Não consegui falar com o banco do clube agora — o app abriu em modo local de teste e o que for lançado fica só neste aparelho. Confira a conexão e recarregue a página.');
    }
  }

  /* sem Supabase configurado: capability do claude.ai, se houver */
  try{ S.db = (typeof claude!=='undefined') ? await claude.use('db') : null; }catch(e){ S.db=null; }
  if(S.db){
    $('#st').classList.add('on');
    /* papel do usuário: escrita de teste num caminho só de treinador; atleta (nível "pode ver") é recusado pelo banco */
    try{ await S.db.doc('probe/whoami').set({ts:Date.now()}); S.role='coach'; }
    catch(e){ S.role = (e&&e.code)==='invalid_argument' ? 'athlete' : 'coach'; }
  } else {
    S.db=localDB(); S.local=true; S.role='coach';
    if($('#offline').hidden) bannerLocal('Modo local de teste — os dados ficam salvos apenas neste navegador. Para ligar o banco compartilhado da equipe, preencha o config.js (passo a passo em docs/SUPABASE.md).');
  }
  ligarColecoes();
})();

</script>
